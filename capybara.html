<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>水豚與我 | 離線保密版</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        capy: {
                            bg: '#FAF4EB',
                            header: '#F5E6D3',
                            card: '#FFFFFF',
                            primary: '#C48A54',
                            secondary: '#E6C9A8',
                            text: '#5C4033',
                            light: '#8B6B56',
                            accent: '#FF9B9B',
                            blue: '#85C1E9',
                            green: '#82E0AA'
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'float': 'float 4s ease-in-out infinite',
                        'float-delayed': 'float 4s ease-in-out 2s infinite',
                        'bounce-slow': 'bounce 3s infinite',
                        'wiggle': 'wiggle 4s ease-in-out infinite',
                        'sway': 'sway 3s ease-in-out infinite alternate',
                        'ripple': 'ripple 2s linear infinite',
                    },
                    keyframes: {
                        slideUp: { '0%': { transform: 'translateY(100%)' }, '100%': { transform: 'translateY(0)' } },
                        popIn: { '0%': { transform: 'scale(0.8)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        float: { '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' }, '50%': { transform: 'translateY(-15px) rotate(2deg)' } },
                        wiggle: { '0%, 100%': { transform: 'rotate(-2deg)' }, '50%': { transform: 'rotate(2deg)' } },
                        sway: { '0%': { transform: 'rotate(-5deg) translateY(0px)' }, '100%': { transform: 'rotate(5deg) translateY(-3px)' } },
                        ripple: { '0%': { boxShadow: '0 0 0 0 rgba(196, 138, 84, 0.3)' }, '100%': { boxShadow: '0 0 0 15px rgba(196, 138, 84, 0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        html { font-size: 16px; } 
        body { background-color: #FAF4EB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; margin: 0; padding: 0; color: #5C4033; }
        ::-webkit-scrollbar { display: none; } * { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .pond-bg { background: linear-gradient(180deg, #FAF4EB 0%, #E3F2FD 100%); }
        
        /* 蓮葉樣式 */
        .lily-pad {
            position: absolute;
            background: #81C784;
            border-radius: 50% 50% 50% 5% / 50% 50% 50% 50%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1), 0 5px 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .lily-pad:active { transform: scale(0.95); }
        .lily-pad::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
            border-radius: inherit; pointer-events: none;
        }

        /* 密碼鍵盤樣式 */
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 260px; margin: 0 auto; }
        .key-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.9); border: 1px solid #E6C9A8; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; color: #C48A54; cursor: pointer; transition: all 0.1s; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .key-btn:active { transform: scale(0.9); background: #F5E6D3; }
        .pass-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #C48A54; transition: 0.2s; }
        .pass-dot.filled { background: #C48A54; }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- 簡易音效 ---
        const playTone = (type = 'pop') => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'pop') {
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'error') {
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        };

        // ---  SVG 圖示 ---
        const Icons = {
            Home: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
            Book: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>,
            Lock: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Plus: () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Close: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Trash: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Bell: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>,
            Calendar: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        };

        // --- 純粹的 SVG 水豚 ---
        const CuteCapyIcon = ({ className = "w-32 h-32" }) => (
            <svg viewBox="0 0 120 120" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="25" y="40" width="70" height="60" rx="30" fill="#C48A54"/>
                <path d="M30 50 C20 40, 25 30, 40 35" fill="#8B6B56" stroke="#5C4033" strokeWidth="2"/>
                <path d="M90 50 C100 40, 95 30, 80 35" fill="#8B6B56" stroke="#5C4033" strokeWidth="2"/>
                <ellipse cx="35" cy="70" rx="6" ry="4" fill="#FFB6C1" opacity="0.8"/>
                <ellipse cx="85" cy="70" rx="6" ry="4" fill="#FFB6C1" opacity="0.8"/>
                <circle cx="45" cy="60" r="4" fill="#333333"/>
                <circle cx="75" cy="60" r="4" fill="#333333"/>
                <rect x="50" y="70" width="20" height="15" rx="7.5" fill="#E6C9A8"/>
                <circle cx="56" cy="75" r="1.5" fill="#5C4033"/>
                <circle cx="64" cy="75" r="1.5" fill="#5C4033"/>
                <path d="M55 80 Q60 84 65 80" stroke="#5C4033" strokeWidth="2" strokeLinecap="round" fill="none"/>
                {/* 橘子頂在頭上 */}
                <circle cx="60" cy="28" r="9" fill="#F9A826"/>
                <path d="M60 19 Q63 15 66 18" stroke="#2E7D32" strokeWidth="2" strokeLinecap="round" fill="none"/>
            </svg>
        );

        // --- 密碼鎖組件 (100% 離線防護) ---
        const LockScreen = ({ onUnlock }) => {
            const [input, setInput] = useState('');
            const [error, setError] = useState(false);
            const CORRECT_PIN = 'caca'; // Default password "caca"

            const handlePress = (val) => {
                if (val === 'del') {
                    setInput(prev => prev.slice(0, -1));
                    setError(false);
                    return;
                }
                
                if (input.length < 4) {
                    playTone('pop');
                    const newVal = input + val;
                    setInput(newVal);
                    
                    if (newVal.length === 4) {
                        if (newVal.toLowerCase() === CORRECT_PIN.toLowerCase()) {
                            playTone('success');
                            setTimeout(onUnlock, 300);
                        } else {
                            playTone('error');
                            setError(true);
                            setTimeout(() => {
                                setInput('');
                                setError(false);
                            }, 500);
                        }
                    }
                }
            };

            return (
                <div className="fixed inset-0 bg-capy-header flex flex-col items-center justify-center z-[9999] transition-opacity duration-300">
                    <div className="mb-8 animate-float">
                        <CuteCapyIcon className="w-32 h-32" />
                    </div>
                    <h2 className="text-xl font-bold text-capy-text mb-8">請輸入密碼解鎖</h2>
                    
                    <div className={`flex gap-4 mb-8 ${error ? 'animate-wiggle' : ''}`}>
                        {[...Array(4)].map((_, i) => (
                            <div key={i} className={`pass-dot ${i < input.length ? 'filled' : ''} ${error ? 'border-red-500' : ''}`}></div>
                        ))}
                    </div>

                    <div className="keypad-grid">
                        {['a','b','c','d','e','f','g','h','i'].map((char) => (
                            <button key={char} onClick={() => handlePress(char)} className="key-btn">{char.toUpperCase()}</button>
                        ))}
                        <div></div>
                        <button onClick={() => handlePress('0')} className="key-btn invisible">0</button>
                        <button onClick={() => handlePress('del')} className="key-btn bg-transparent border-none shadow-none text-2xl">⌫</button>
                    </div>
                </div>
            );
        };

        // --- 主應用程式 ---
        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [tasks, setTasks] = useState(() => {
                try { return JSON.parse(localStorage.getItem('capy_offline_tasks')) || []; } catch(e) { return []; }
            });
            const [isSheetOpen, setIsSheetOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            
            // 提醒表單
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [time, setTime] = useState('');
            const [category, setCategory] = useState('');
            const [activeAlert, setActiveAlert] = useState(null);

            const categories = [
                { id: 'work', icon: '💼', name: '工作', color: 'bg-blue-100 text-blue-600 border-blue-200' },
                { id: 'family', icon: '🏠', name: '家庭', color: 'bg-orange-100 text-orange-600 border-orange-200' },
                { id: 'idea', icon: '💡', name: '靈感', color: 'bg-purple-100 text-purple-600 border-purple-200' },
                { id: 'health', icon: '🏃', name: '健康', color: 'bg-green-100 text-green-600 border-green-200' },
            ];

            // 存儲機制
            useEffect(() => {
                localStorage.setItem('capy_offline_tasks', JSON.stringify(tasks));
            }, [tasks]);

            // 自動設定新增行程的時間為當前時間
            useEffect(() => {
                if (isSheetOpen) {
                    const now = new Date();
                    const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    setDate(localDate);
                    setTime(now.toTimeString().substring(0, 5));
                }
            }, [isSheetOpen]);

            // Toast
            const showT = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // 檢查到期
            useEffect(() => {
                if (isLocked) return;
                const timer = setInterval(() => {
                    const now = new Date();
                    const currentLocalTime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
                    const currentDateStr = currentLocalTime.toISOString().split('T')[0];
                    const currentTimeStr = now.toTimeString().substring(0, 5);

                    const dueTask = tasks.find(t => 
                        t.date === currentDateStr && 
                        t.time === currentTimeStr && 
                        !t.isTriggered
                    );

                    if (dueTask) {
                        setTasks(prev => prev.map(t => 
                            t.id === dueTask.id ? { ...t, isTriggered: true } : t
                        ));
                        setActiveAlert(dueTask);
                        playTone('success');
                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [tasks, isLocked]);

            const setQuickTime = (type) => {
                const now = new Date();
                if (type === '10m') now.setMinutes(now.getMinutes() + 10);
                else if (type === '1h') now.setHours(now.getHours() + 1);
                else if (type === 'tmr') { now.setDate(now.getDate() + 1); now.setHours(9, 0, 0, 0); }
                
                const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                setDate(localDate);
                setTime(now.toTimeString().substring(0, 5));
                playTone('pop');
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!title.trim() || !date || !time) return;
                const newTask = {
                    id: Date.now().toString(),
                    title: title.trim(),
                    date,
                    time,
                    category: category || 'idea', // 預設靈感
                    isTriggered: false
                };
                setTasks(prev => [...prev, newTask].sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`)));
                setTitle(''); setCategory(''); setIsSheetOpen(false);
                showT('✨ 提醒已儲存 (100% 離線)');
                playTone('success');
            };

            // --- AI 水花池塘渲染 (視覺化提醒) ---
            const renderLilyPads = () => {
                const activeTasks = tasks.filter(t => !t.isTriggered).slice(0, 8); // 最多顯示 8 個
                if (activeTasks.length === 0) return null;

                return activeTasks.map((task, index) => {
                    // 簡單的隨機散佈邏輯
                    const top = 15 + Math.abs(Math.sin(index * 123) * 60) + '%';
                    const left = 10 + Math.abs(Math.cos(index * 321) * 70) + '%';
                    const catObj = categories.find(c => c.id === task.category) || categories[2];
                    const delay = (index * 0.5) + 's';
                    
                    // 根據文字長度決定大小，將整體尺寸放大以增添可愛感與可讀性
                    const size = Math.max(100, Math.min(160, 80 + task.title.length * 10));

                    return (
                        <div 
                            key={task.id}
                            className={`lily-pad ${index % 2 === 0 ? 'animate-float' : 'animate-float-delayed'} absolute shadow-lg`}
                            style={{ 
                                top, left, 
                                width: `${size}px`, height: `${size}px`,
                                animationDelay: delay
                            }}
                            onClick={() => {
                                setActiveAlert(task);
                                playTone('pop');
                            }}
                        >
                            <div className="text-center p-3 text-white drop-shadow-md flex flex-col items-center justify-center w-full h-full">
                                <span className="text-4xl mb-2 drop-shadow-lg">{catObj.icon}</span>
                                <span className="text-[13px] font-bold leading-snug line-clamp-2 w-full px-2 break-words">
                                    {task.title}
                                </span>
                            </div>
                        </div>
                    );
                });
            };

            if (isLocked) {
                return <LockScreen onUnlock={() => setIsLocked(false)} />;
            }

            return (
                <div className="relative w-full h-screen bg-capy-bg text-capy-text overflow-hidden flex flex-col font-sans">
                    
                    {/* Toast */}
                    <div className={`fixed top-10 left-1/2 transform -translate-x-1/2 bg-capy-text text-white px-5 py-2.5 rounded-full z-[6000] shadow-xl text-sm font-bold flex items-center gap-2 transition-all duration-400 ease-out ${toastMsg ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-12 pointer-events-none'}`}>
                        {toastMsg}
                    </div>

                    <main className="flex-1 overflow-hidden flex flex-col pb-20">
                        {/* --- 首頁：水花池塘 --- */}
                        {activeTab === 'home' && (
                            <div className="h-full flex flex-col animate-pop-in relative pond-bg">
                                <header className="pt-10 pb-4 px-6 flex justify-between items-center z-10 relative">
                                    <div>
                                        <h1 className="text-2xl font-black text-capy-text tracking-wide drop-shadow-sm">水豚與我</h1>
                                        <p className="text-capy-primary text-xs font-bold mt-1 bg-white/50 inline-block px-2 py-0.5 rounded-full">100% 離線保密</p>
                                    </div>
                                    <button onClick={() => setIsLocked(true)} className="p-2 bg-white/60 rounded-full text-capy-primary shadow-sm hover:bg-white transition-colors">
                                        <Icons.Lock />
                                    </button>
                                </header>

                                {/* 互動池塘區 */}
                                <div className="flex-1 relative overflow-hidden mt-4">
                                    {/* 裝飾波紋 */}
                                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-32 h-32 rounded-full animate-ripple z-0"></div>
                                    
                                    {/* 蓮葉提醒 */}
                                    {renderLilyPads()}

                                    {/* 中央水豚 */}
                                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none">
                                        <CuteCapyIcon className="w-36 h-36 drop-shadow-xl animate-sway" />
                                    </div>

                                    {tasks.filter(t => !t.isTriggered).length === 0 && (
                                        <div className="absolute bottom-20 w-full text-center text-capy-light/70 font-bold text-sm z-0">
                                            水面平靜...點擊下方「+」新增事項
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* --- 列表頁：詳細紀錄 --- */}
                        {activeTab === 'list' && (
                            <div className="h-full flex flex-col animate-pop-in bg-white pt-10 px-6 overflow-y-auto pb-24">
                                <h1 className="text-2xl font-black text-capy-text mb-6">所有事項庫</h1>
                                {tasks.length === 0 ? (
                                    <div className="text-center opacity-50 mt-10"><p className="font-bold">尚無紀錄</p></div>
                                ) : (
                                    <div className="space-y-4">
                                        {tasks.map(task => {
                                            const cat = categories.find(c => c.id === task.category) || categories[2];
                                            return (
                                                <div key={task.id} className={`p-4 rounded-2xl border flex items-center justify-between transition-all ${task.isTriggered ? 'bg-gray-50 border-gray-200 grayscale opacity-60' : 'bg-white border-capy-secondary shadow-sm'}`}>
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl ${task.isTriggered ? 'bg-gray-200' : 'bg-capy-header'}`}>
                                                            {cat.icon}
                                                        </div>
                                                        <div>
                                                            <h3 className={`font-bold text-base ${task.isTriggered ? 'line-through text-gray-400' : 'text-capy-text'}`}>{task.title}</h3>
                                                            <div className="text-xs font-medium text-capy-light mt-1">
                                                                {task.date.replace(/-/g, '/')} • {task.time}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => handleDelete(task.id)} className="p-2 text-gray-300 hover:text-red-400 active:scale-90 transition-transform">
                                                        <Icons.Trash />
                                                    </button>
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* --- 底部導航列 --- */}
                    <nav className="absolute bottom-0 w-full h-20 bg-white/90 backdrop-blur-md rounded-t-[2rem] shadow-[0_-5px_30px_rgba(0,0,0,0.05)] flex justify-around items-center px-8 z-20 border-t border-gray-100">
                        <button onClick={() => { setActiveTab('home'); playTone('pop'); }} className={`flex flex-col items-center gap-1 p-2 transition-colors ${activeTab === 'home' ? 'text-capy-primary' : 'text-gray-300'}`}>
                            <Icons.Home />
                        </button>

                        <div className="relative -top-6">
                            <button 
                                onClick={() => { setIsSheetOpen(true); playTone('pop'); }}
                                className="bg-capy-primary text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-capy-primary/30 hover:brightness-105 active:scale-90 transition-transform border-4 border-white"
                            >
                                <Icons.Plus />
                            </button>
                        </div>

                        <button onClick={() => { setActiveTab('list'); playTone('pop'); }} className={`flex flex-col items-center gap-1 p-2 transition-colors ${activeTab === 'list' ? 'text-capy-primary' : 'text-gray-300'}`}>
                            <Icons.Book />
                        </button>
                    </nav>

                    {/* --- 新增行程 Bottom Sheet (深度優化版) --- */}
                    {isSheetOpen && (
                        <div className="absolute inset-0 z-40 flex flex-col justify-end">
                            <div className="absolute inset-0 bg-capy-text/30 backdrop-blur-sm transition-opacity" onClick={() => setIsSheetOpen(false)}></div>
                            <div className="relative bg-white w-full rounded-t-[2.5rem] pt-5 pb-10 px-6 animate-slide-up shadow-2xl max-h-[90vh] overflow-y-auto">
                                <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-5"></div>
                                <div className="flex justify-between items-center mb-5">
                                    <h2 className="text-xl font-bold flex items-center gap-2 text-capy-text"><span>📝</span> 新增提醒</h2>
                                    <button onClick={() => setIsSheetOpen(false)} className="p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-600"><Icons.Close /></button>
                                </div>
                                
                                <form onSubmit={handleAddTask} className="space-y-5">
                                    {/* 智能分類標籤 */}
                                    <div>
                                        <label className="block text-xs font-bold text-capy-light mb-2">分類</label>
                                        <div className="flex gap-2">
                                            {categories.map(cat => (
                                                <button 
                                                    key={cat.id} type="button" 
                                                    onClick={() => { setCategory(cat.id); playTone('pop'); }}
                                                    className={`flex-1 py-2 rounded-xl text-sm font-bold border transition-all ${category === cat.id ? cat.color + ' scale-105 shadow-sm' : 'bg-gray-50 border-gray-100 text-gray-400'}`}
                                                >
                                                    {cat.icon} {cat.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-capy-light mb-2">事項內容</label>
                                        <input 
                                            type="text" value={title} onChange={e => setTitle(e.target.value)} 
                                            placeholder="例如：整理報表、買牛奶..." 
                                            className="w-full bg-capy-bg rounded-xl px-4 py-3.5 outline-none font-medium text-capy-text focus:ring-2 focus:ring-capy-primary/50 border border-transparent focus:border-capy-primary/30 transition-all" 
                                            required 
                                        />
                                    </div>

                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-capy-light mb-2">日期</label>
                                            <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-capy-bg rounded-xl px-4 py-3 outline-none font-medium text-capy-text border border-transparent focus:ring-2 focus:ring-capy-primary/50" required />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-capy-light mb-2">時間</label>
                                            <input type="time" value={time} onChange={e => setTime(e.target.value)} className="w-full bg-capy-bg rounded-xl px-4 py-3 outline-none font-medium text-capy-text border border-transparent focus:ring-2 focus:ring-capy-primary/50" required />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setQuickTime('10m')} className="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-capy-primary border border-capy-primary/30 active:bg-capy-header transition-colors">10分鐘後</button>
                                        <button type="button" onClick={() => setQuickTime('1h')} className="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-capy-primary border border-capy-primary/30 active:bg-capy-header transition-colors">1小時後</button>
                                        <button type="button" onClick={() => setQuickTime('tmr')} className="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-capy-primary border border-capy-primary/30 active:bg-capy-header transition-colors">明天</button>
                                    </div>

                                    <button type="submit" className="w-full bg-capy-primary text-white font-bold text-lg py-3.5 rounded-xl mt-2 active:scale-95 transition-transform shadow-lg shadow-capy-primary/30 flex justify-center items-center gap-2">
                                        讓水豚記住
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- 全螢幕到期提醒 (精緻卡片版) --- */}
                    {activeAlert && (
                        <div className="absolute inset-0 z-[7000] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-capy-text/60 backdrop-blur-sm" onClick={() => setActiveAlert(null)}></div>
                            <div className="relative w-full max-w-sm bg-white rounded-3xl p-8 flex flex-col items-center text-center animate-pop-in shadow-2xl overflow-hidden border-2 border-capy-primary/20">
                                <div className="absolute top-0 inset-x-0 h-32 bg-capy-header rounded-b-full pointer-events-none"></div>
                                
                                <div className="z-10 mb-4 bg-white p-2 rounded-full shadow-md border-4 border-capy-bg animate-bounce-slow">
                                    <CuteCapyIcon className="w-24 h-24" />
                                </div>
                                
                                <div className="mt-2 z-10 w-full">
                                    <span className="inline-block bg-capy-accent text-white font-bold px-4 py-1 rounded-full text-xs mb-4 shadow-sm tracking-wider">
                                        叮咚！時間到了
                                    </span>
                                    <h2 className="text-xl font-black text-capy-text mb-3 break-words leading-tight">{activeAlert.title}</h2>
                                    <div className="flex justify-center items-center gap-4 text-capy-light font-bold text-sm mb-8 bg-gray-50 py-2 px-4 rounded-xl">
                                        <span className="flex items-center gap-1"><Icons.Calendar /> {activeAlert.date}</span>
                                        <span className="flex items-center gap-1"><Icons.Bell /> {activeAlert.time}</span>
                                    </div>
                                    <button onClick={() => { setActiveAlert(null); playTone('pop'); }} className="w-full bg-capy-primary text-white font-bold text-lg py-3.5 rounded-xl active:scale-95 transition-transform shadow-lg shadow-capy-primary/30">
                                        收到啦！
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

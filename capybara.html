<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>水豚與我 | 終極大數據版</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        capy: {
                            bg: '#FAF4EB',
                            header: '#F5E6D3',
                            card: '#FFFFFF',
                            primary: '#C48A54',
                            secondary: '#E6C9A8',
                            text: '#5C4033',
                            light: '#8B6B56',
                            accent: '#FF9B9B',
                            blue: '#85C1E9',
                            green: '#82E0AA'
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'float': 'float 4s ease-in-out infinite',
                        'float-delayed': 'float 4s ease-in-out 2s infinite',
                        'bounce-slow': 'bounce 3s infinite',
                        'wiggle': 'wiggle 4s ease-in-out infinite',
                        'sway': 'sway 3s ease-in-out infinite alternate',
                        'ripple': 'ripple 2s linear infinite',
                    },
                    keyframes: {
                        slideUp: { '0%': { transform: 'translateY(100%)' }, '100%': { transform: 'translateY(0)' } },
                        popIn: { '0%': { transform: 'scale(0.8)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        float: { '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' }, '50%': { transform: 'translateY(-15px) rotate(2deg)' } },
                        wiggle: { '0%, 100%': { transform: 'rotate(-2deg)' }, '50%': { transform: 'rotate(2deg)' } },
                        sway: { '0%': { transform: 'rotate(-5deg) translateY(0px)' }, '100%': { transform: 'rotate(5deg) translateY(-3px)' } },
                        ripple: { '0%': { boxShadow: '0 0 0 0 rgba(196, 138, 84, 0.3)' }, '100%': { boxShadow: '0 0 0 15px rgba(196, 138, 84, 0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        html { font-size: 16px; } 
        body { 
            background-color: #FAF4EB; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
            margin: 0; padding: 0; color: #5C4033; 
        }
        ::-webkit-scrollbar { display: none; } * { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .pond-bg { background: linear-gradient(180deg, rgba(250,244,235,0.2) 0%, rgba(227,242,253,0.8) 100%); }
        
        /* 創意背景設定：全域底圖 + 半透明遮罩保證文字可讀性 */
        .app-container {
            background-image: url('uploaded:imagesc3.jfif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .app-overlay {
            background: rgba(250, 244, 235, 0.88); /* 奶油色遮罩 */
            backdrop-filter: blur(4px); /* 輕微毛玻璃 */
        }

        /* 蓮葉樣式 (放大版) */
        .lily-pad {
            position: absolute;
            background: #81C784;
            border-radius: 50% 50% 50% 5% / 50% 50% 50% 50%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1), 0 5px 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .lily-pad:active { transform: scale(0.9) !important; }
        .lily-pad::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
            border-radius: inherit; pointer-events: none;
        }

        /* 密碼鍵盤樣式 */
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 260px; margin: 0 auto; }
        .key-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.9); border: 1px solid #E6C9A8; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; color: #C48A54; cursor: pointer; transition: all 0.1s; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .key-btn:active { transform: scale(0.9); background: #F5E6D3; }
        .pass-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #C48A54; transition: 0.2s; }
        .pass-dot.filled { background: #C48A54; }

        /* iOS 安全邊距 */
        .safe-pb { padding-bottom: calc(85px + env(safe-area-inset-bottom)); }
        .nav-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- 深度修復 iOS AudioContext ---
        let sharedAudioCtx = null;
        const initAudio = () => {
            if (!sharedAudioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) sharedAudioCtx = new AudioContext();
            }
            if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
                sharedAudioCtx.resume();
            }
            return sharedAudioCtx;
        };

        const playTone = (type = 'pop') => {
            try {
                const ctx = initAudio();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'pop') {
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'error') {
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        };

        // --- SVG 圖示 ---
        const Icons = {
            Home: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
            Book: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>,
            Pen: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>,
            Gamepad: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4"></path><path d="M8 10v4"></path><path d="M15 13h.01"></path><path d="M18 11h.01"></path></svg>,
            Lock: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Plus: () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Close: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Trash: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Bell: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>,
            Calendar: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        };

        const CuteCapyIcon = ({ className = "w-32 h-32" }) => (
            <svg viewBox="0 0 120 120" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="25" y="40" width="70" height="60" rx="30" fill="#C48A54"/>
                <path d="M30 50 C20 40, 25 30, 40 35" fill="#8B6B56" stroke="#5C4033" strokeWidth="2"/>
                <path d="M90 50 C100 40, 95 30, 80 35" fill="#8B6B56" stroke="#5C4033" strokeWidth="2"/>
                <ellipse cx="35" cy="70" rx="6" ry="4" fill="#FFB6C1" opacity="0.8"/>
                <ellipse cx="85" cy="70" rx="6" ry="4" fill="#FFB6C1" opacity="0.8"/>
                <circle cx="45" cy="60" r="4" fill="#333333"/>
                <circle cx="75" cy="60" r="4" fill="#333333"/>
                <rect x="50" y="70" width="20" height="15" rx="7.5" fill="#E6C9A8"/>
                <circle cx="56" cy="75" r="1.5" fill="#5C4033"/>
                <circle cx="64" cy="75" r="1.5" fill="#5C4033"/>
                <path d="M55 80 Q60 84 65 80" stroke="#5C4033" strokeWidth="2" strokeLinecap="round" fill="none"/>
                <circle cx="60" cy="28" r="9" fill="#F9A826"/>
                <path d="M60 19 Q63 15 66 18" stroke="#2E7D32" strokeWidth="2" strokeLinecap="round" fill="none"/>
            </svg>
        );

        // --- 密碼鎖組件 ---
        const LockScreen = ({ onUnlock }) => {
            const [input, setInput] = useState('');
            const [error, setError] = useState(false);
            const CORRECT_PIN = 'caca';

            const handlePress = (val) => {
                initAudio(); // 確保 iOS 解鎖音效
                if (val === 'del') {
                    setInput(prev => prev.slice(0, -1));
                    setError(false);
                    return;
                }
                
                if (input.length < 4) {
                    playTone('pop');
                    const newVal = input + val;
                    setInput(newVal);
                    
                    if (newVal.length === 4) {
                        if (newVal.toLowerCase() === CORRECT_PIN.toLowerCase()) {
                            playTone('success');
                            setTimeout(onUnlock, 300);
                        } else {
                            playTone('error');
                            setError(true);
                            setTimeout(() => { setInput(''); setError(false); }, 500);
                        }
                    }
                }
            };

            return (
                <div className="fixed inset-0 bg-capy-header flex flex-col items-center justify-center z-[9999] transition-opacity duration-300">
                    <div className="mb-8 animate-float">
                        <CuteCapyIcon className="w-32 h-32 drop-shadow-lg" />
                    </div>
                    <h2 className="text-xl font-bold text-capy-text mb-8">專屬空間解鎖</h2>
                    
                    <div className={`flex gap-4 mb-10 ${error ? 'animate-wiggle' : ''}`}>
                        {[...Array(4)].map((_, i) => (
                            <div key={i} className={`pass-dot ${i < input.length ? 'filled' : ''} ${error ? 'border-red-500' : ''}`}></div>
                        ))}
                    </div>

                    <div className="keypad-grid">
                        {['a','b','c','d','e','f','g','h','i'].map((char) => (
                            <button key={char} onClick={() => handlePress(char)} className="key-btn shadow-sm bg-white/90 backdrop-blur-sm">{char.toUpperCase()}</button>
                        ))}
                        <div></div>
                        <button onClick={() => handlePress('0')} className="key-btn invisible">0</button>
                        <button onClick={() => handlePress('del')} className="key-btn bg-transparent border-none shadow-none text-2xl">⌫</button>
                    </div>
                </div>
            );
        };

        // --- 互動遊戲：水豚任務記憶大師 ---
        const MemoryTaskGame = ({ tasks }) => {
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [solved, setSolved] = useState([]);
            const [comboMsg, setComboMsg] = useState('');

            const emojis = ['💼', '🏠', '💡', '🏃', '🍎', '🦦'];
            
            useEffect(() => { resetGame(); }, []);

            const resetGame = () => {
                const initialCards = [...emojis, ...emojis]
                    .sort(() => Math.random() - 0.5)
                    .map((icon, id) => ({ id, icon }));
                setCards(initialCards);
                setFlipped([]);
                setSolved([]);
                setComboMsg('');
            };

            const handleFlip = (index) => {
                initAudio();
                if (flipped.length === 2 || flipped.includes(index) || solved.includes(index)) return;
                
                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);
                playTone('pop');

                if (newFlipped.length === 2) {
                    const match = cards[newFlipped[0]].icon === cards[newFlipped[1]].icon;
                    if (match) {
                        setSolved([...solved, ...newFlipped]);
                        
                        // 遊戲互動式提醒：從未完成的任務中隨機挑選
                        const activeTasks = tasks.filter(t => !t.isTriggered);
                        if (activeTasks.length > 0) {
                            const randomTask = activeTasks[Math.floor(Math.random() * activeTasks.length)];
                            setComboMsg(`✨ 記憶湧現: ${randomTask.title}`);
                        } else {
                            setComboMsg(`✨ 太棒了！今天沒有未完成的任務！`);
                        }
                        
                        playTone('success');
                        setTimeout(() => setComboMsg(''), 3500);
                    } else {
                        setTimeout(() => playTone('error'), 100);
                    }
                    setTimeout(() => setFlipped([]), 800);
                }
            };

            return (
                <div className="flex-1 w-full h-full relative flex flex-col items-center pt-6 px-6 overflow-y-auto safe-pb">
                    <div className="text-center mb-6 bg-white/70 backdrop-blur-md px-6 py-3 rounded-2xl border border-white/50 shadow-sm">
                        <h2 className="text-2xl font-black text-capy-text">任務翻翻樂</h2>
                        <p className="text-sm font-bold text-capy-light mt-1">配對成功將解鎖一則日常提醒！</p>
                    </div>
                    
                    {comboMsg && (
                        <div className="absolute top-28 bg-white/95 backdrop-blur-sm px-6 py-4 rounded-2xl shadow-xl border-2 border-capy-secondary text-capy-primary font-bold z-10 animate-pop-in text-center w-[85%] text-base">
                            {comboMsg}
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-4 w-full max-w-[300px]">
                        {cards.map((card, i) => {
                            const isFlipped = flipped.includes(i) || solved.includes(i);
                            return (
                                <div 
                                    key={card.id} 
                                    onClick={() => handleFlip(i)}
                                    className={`h-24 rounded-2xl cursor-pointer transition-all duration-300 shadow-sm flex items-center justify-center text-4xl select-none ${isFlipped ? 'bg-white border-2 border-capy-secondary scale-100' : 'bg-capy-primary border-b-4 border-[#B8815A] active:scale-95 bg-opacity-90 backdrop-blur-sm'}`}
                                >
                                    {isFlipped ? card.icon : '❓'}
                                </div>
                            );
                        })}
                    </div>
                    
                    {solved.length === cards.length && cards.length > 0 && (
                        <div className="mt-8 animate-bounce-slow">
                            <button onClick={resetGame} className="bg-capy-primary text-white font-black py-3 px-8 rounded-full shadow-lg active:scale-95 transition-transform text-base">再來一局</button>
                        </div>
                    )}
                </div>
            );
        };

        // --- 主應用程式 ---
        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [activeTab, setActiveTab] = useState('home'); // 'home', 'game', 'diary', 'list'
            
            // 行程狀態
            const [tasks, setTasks] = useState(() => {
                try { return JSON.parse(localStorage.getItem('capy_tasks_v_ultimate')) || []; } catch(e) { return []; }
            });

            // 日記與大數據狀態
            const [diary, setDiary] = useState(() => {
                try { return JSON.parse(localStorage.getItem('capy_diary_v_ultimate')) || []; } catch(e) { return []; }
            });

            const [isSheetOpen, setIsSheetOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            
            // 提醒表單
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [time, setTime] = useState('');
            const [category, setCategory] = useState('');
            const [activeAlert, setActiveAlert] = useState(null);

            // 日記表單
            const [diaryText, setDiaryText] = useState('');
            const [diaryImg, setDiaryImg] = useState('');
            const [activeTags, setActiveTags] = useState([]);

            const categories = [
                { id: 'work', icon: '💼', name: '工作', color: 'bg-blue-100 text-blue-600 border-blue-200' },
                { id: 'family', icon: '🏠', name: '家庭', color: 'bg-orange-100 text-orange-600 border-orange-200' },
                { id: 'idea', icon: '💡', name: '靈感', color: 'bg-purple-100 text-purple-600 border-purple-200' },
                { id: 'health', icon: '🏃', name: '健康', color: 'bg-green-100 text-green-600 border-green-200' },
            ];

            // 存儲機制 (防爆處理)
            useEffect(() => { localStorage.setItem('capy_tasks_v_ultimate', JSON.stringify(tasks)); }, [tasks]);
            
            useEffect(() => {
                try {
                    localStorage.setItem('capy_diary_v_ultimate', JSON.stringify(diary));
                } catch (e) {
                    if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
                        const safeDiary = diary.slice(0, Math.floor(diary.length / 2));
                        setDiary(safeDiary);
                        localStorage.setItem('capy_diary_v_ultimate', JSON.stringify(safeDiary));
                        showT('⚠️ 儲存空間已滿，已自動清理舊照片紀錄！');
                    }
                }
            }, [diary]);

            // 自動設定新增行程的時間為當前時間
            useEffect(() => {
                if (isSheetOpen) {
                    const now = new Date();
                    const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    setDate(localDate);
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    setTime(`${hours}:${minutes}`);
                }
            }, [isSheetOpen]);

            // Toast
            const showT = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); };

            // 檢查到期 (包含背景推播)
            useEffect(() => {
                if (isLocked) return;
                const timer = setInterval(() => {
                    const now = new Date();
                    const currentLocalTime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
                    const currentDateStr = currentLocalTime.toISOString().split('T')[0];
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const currentTimeStr = `${hours}:${minutes}`;

                    const dueTask = tasks.find(t => t.date === currentDateStr && t.time === currentTimeStr && !t.isTriggered);

                    if (dueTask) {
                        setTasks(prev => prev.map(t => t.id === dueTask.id ? { ...t, isTriggered: true } : t));
                        setActiveAlert(dueTask);
                        playTone('success');
                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                        
                        if (document.hidden && "Notification" in window && Notification.permission === "granted") {
                            new Notification("水豚與我 - 提醒您 🔔", { body: `時間到了：${dueTask.title}` });
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [tasks, isLocked]);

            const setQuickTime = (type) => {
                const now = new Date();
                if (type === '10m') now.setMinutes(now.getMinutes() + 10);
                else if (type === '1h') now.setHours(now.getHours() + 1);
                else if (type === 'tmr') { now.setDate(now.getDate() + 1); now.setHours(9, 0, 0, 0); }
                
                const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                setDate(localDate);
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                setTime(`${hours}:${minutes}`);
                playTone('pop');
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!title.trim() || !date || !time) return;
                const newTask = {
                    id: Date.now().toString(), title: title.trim(), date, time, 
                    category: category || 'idea', isTriggered: false
                };
                setTasks(prev => [...prev, newTask].sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`)));
                setTitle(''); setCategory(''); setIsSheetOpen(false); setActiveTab('home');
                showT('✨ 提醒已儲存 (100% 離線)'); playTone('success');
            };

            const handleDeleteTask = (id) => { setTasks(prev => prev.filter(t => t.id !== id)); };

            // --- 照相與極致壓縮引擎 ---
            const handleImageUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 400; let ratio = MAX_WIDTH / img.width; if (ratio > 1) ratio = 1;
                        canvas.width = img.width * ratio; canvas.height = img.height * ratio;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        setDiaryImg(canvas.toDataURL('image/jpeg', 0.6)); // 極致壓縮 60% 畫質
                        showT('📸 相片優化成功！');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const toggleTag = (catId) => {
                if(activeTags.includes(catId)) setActiveTags(activeTags.filter(t => t !== catId));
                else setActiveTags([...activeTags, catId]);
                playTone('pop');
            };

            const handleAddDiary = () => {
                if (!diaryText.trim() && !diaryImg) return showT('請輸入文字或照片！');
                const newEntry = { id: Date.now().toString(), time: new Date().getTime(), text: diaryText, tags: activeTags, img: diaryImg };
                setDiary(prev => [newEntry, ...prev]);
                setDiaryText(''); setDiaryImg(''); setActiveTags([]); showT('📝 紀錄成功！'); playTone('success');
            };

            // --- 視覺化提醒：AI 水花池塘 (搭配 imagesc3.jfif 創意背景) ---
            const renderLilyPads = () => {
                const activeTasks = tasks.filter(t => !t.isTriggered).slice(0, 7);
                if (activeTasks.length === 0) return null;

                return activeTasks.map((task, index) => {
                    // 根據索引計算散佈的相對位置，避免重疊
                    const top = 10 + Math.abs(Math.sin(index * 13) * 65) + '%';
                    const left = 5 + Math.abs(Math.cos(index * 27) * 70) + '%';
                    const catObj = categories.find(c => c.id === task.category) || categories[2];
                    const delay = (index * 0.4) + 's';
                    const size = Math.max(110, Math.min(160, 90 + task.title.length * 8)); // 方塊大小

                    return (
                        <div 
                            key={task.id}
                            className={`lily-pad ${index % 2 === 0 ? 'animate-float' : 'animate-float-delayed'} absolute shadow-lg select-none`}
                            style={{ top, left, width: `${size}px`, height: `${size}px`, animationDelay: delay, background: 'rgba(255,255,255,0.85)', border: `2px solid ${catObj.color.split(' ')[2].replace('border-', '')}` }}
                            onClick={() => { setActiveAlert(task); playTone('pop'); }}
                        >
                            <div className="text-center p-2 flex flex-col items-center justify-center w-full h-full pointer-events-none">
                                <span className="text-[32px] mb-1 drop-shadow-sm">{catObj.icon}</span>
                                <span className="text-[12px] font-bold leading-snug line-clamp-2 w-full px-1 break-words text-gray-700">
                                    {task.title}
                                </span>
                            </div>
                        </div>
                    );
                });
            };

            if (isLocked) return <LockScreen onUnlock={() => setIsLocked(false)} />;

            return (
                <div className="relative w-full h-screen overflow-hidden flex flex-col font-sans app-container">
                    {/* 半透明遮罩，確保閱讀性 */}
                    <div className="absolute inset-0 app-overlay z-0 pointer-events-none"></div>
                    
                    {/* Toast */}
                    <div className={`fixed top-10 left-1/2 transform -translate-x-1/2 bg-capy-text text-white px-5 py-2.5 rounded-full z-[6000] shadow-xl text-sm font-bold flex items-center gap-2 transition-all duration-400 ease-out ${toastMsg ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-12 pointer-events-none'}`}>
                        {toastMsg}
                    </div>

                    <main className="flex-1 overflow-hidden flex flex-col safe-pb z-10 relative">
                        {/* --- 首頁：視覺水花池塘 --- */}
                        {activeTab === 'home' && (
                            <div className="h-full flex flex-col animate-pop-in relative">
                                <header className="pt-10 pb-2 px-6 flex justify-between items-center z-10 relative">
                                    <div>
                                        <h1 className="text-2xl font-black text-capy-text tracking-wide drop-shadow-sm">水豚與我</h1>
                                        <p className="text-capy-primary text-xs font-bold mt-1 bg-white/70 backdrop-blur px-2 py-0.5 rounded-full border border-white/50 inline-block shadow-sm">100% 離線隱私</p>
                                    </div>
                                    <button onClick={() => setIsLocked(true)} className="p-2 bg-white/80 backdrop-blur rounded-full text-capy-primary shadow-sm hover:bg-white transition-colors border border-white/50">
                                        <Icons.Lock />
                                    </button>
                                </header>

                                <div className="flex-1 relative overflow-hidden mt-2">
                                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-48 h-48 rounded-full animate-ripple z-0"></div>
                                    
                                    {renderLilyPads()}

                                    {tasks.filter(t => !t.isTriggered).length === 0 && (
                                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center w-full z-0 px-6">
                                            <div className="bg-white/70 backdrop-blur-md p-6 rounded-3xl border border-white/50 shadow-sm inline-block">
                                                <p className="text-lg font-bold text-capy-text mb-1">今日尚無提醒</p>
                                                <p className="text-xs text-capy-light font-bold">點擊下方「+」讓水豚幫你記住吧</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* --- 日記與大數據頁面 --- */}
                        {activeTab === 'diary' && (
                            <div className="h-full flex flex-col animate-pop-in pt-10 px-6 overflow-y-auto">
                                <h1 className="text-2xl font-black text-capy-text mb-4">大數據日記</h1>
                                
                                {/* 新增日記區塊 */}
                                <div className="bg-white/90 backdrop-blur-md p-5 rounded-3xl shadow-sm border border-white/50 mb-6">
                                    <div className="flex gap-2 mb-3">
                                        {categories.map(cat => (
                                            <button key={cat.id} onClick={() => toggleTag(cat.id)} className={`flex-1 py-1.5 rounded-lg text-[10px] font-bold border transition-colors ${activeTags.includes(cat.id) ? cat.color : 'bg-gray-50 border-gray-100 text-gray-500'}`}>
                                                {cat.icon} {cat.name}
                                            </button>
                                        ))}
                                    </div>
                                    
                                    {!diaryImg ? (
                                        <label className="flex flex-col items-center justify-center bg-capy-bg/50 border-2 border-dashed border-capy-secondary rounded-xl p-4 cursor-pointer text-capy-light active:scale-95 transition-transform mb-3">
                                            <span className="text-2xl mb-1">📸</span><span className="font-bold text-[10px]">拍攝或上傳相片 (極致壓縮)</span>
                                            <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                        </label>
                                    ) : (
                                        <div className="relative mb-3">
                                            <img src={diaryImg} className="w-full rounded-xl border-2 border-white shadow-sm object-cover max-h-40" />
                                            <button onClick={() => setDiaryImg('')} className="absolute top-2 right-2 bg-white/90 p-1.5 rounded-full shadow text-gray-500 hover:text-red-500"><Icons.Close /></button>
                                        </div>
                                    )}
                                    
                                    <textarea className="w-full bg-capy-bg/50 rounded-xl p-3 border border-capy-secondary/50 outline-none focus:ring-2 focus:ring-capy-primary resize-none font-medium text-capy-text text-sm mb-3" rows="3" placeholder="記錄生活點滴..." value={diaryText} onChange={e => setDiaryText(e.target.value)}></textarea>
                                    <button onClick={handleAddDiary} className="w-full bg-capy-text text-white font-bold text-sm py-3 rounded-xl shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
                                        <Icons.Pen /> 儲存加密日記
                                    </button>
                                </div>

                                {/* 日記歷史列表 */}
                                <div className="space-y-4 pb-10">
                                    {diary.map(d => (
                                        <div key={d.id} className="bg-white/90 backdrop-blur-md p-5 rounded-3xl shadow-sm border border-white/50">
                                            <div className="flex justify-between mb-2">
                                                <div className="text-[11px] text-capy-light font-bold">{new Date(d.time).toLocaleString()}</div>
                                                <button onClick={() => deleteDiary(d.id)} className="text-gray-300 hover:text-red-400"><Icons.Trash /></button>
                                            </div>
                                            {d.tags && d.tags.length > 0 && <div className="flex gap-1 mb-2">{d.tags.map(t => {
                                                const cat = categories.find(c=>c.id===t);
                                                return cat ? <span key={t} className={`text-[10px] px-2 py-0.5 rounded-md font-bold ${cat.color}`}>{cat.icon} {cat.name}</span> : null;
                                            })}</div>}
                                            <div className="text-capy-text font-medium text-sm whitespace-pre-wrap leading-relaxed">{d.text}</div>
                                            {d.img && (
                                                <div className="mt-3">
                                                    <img src={d.img} className="w-full rounded-xl border border-gray-100 mb-2 shadow-sm" />
                                                    <a href={d.img} download={`capy_${d.time}.jpg`} className="inline-block bg-capy-bg text-capy-primary text-[11px] font-bold py-1.5 px-3 rounded-lg border border-capy-secondary">📥 下載相片</a>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* --- 遊戲頁：記憶大師 --- */}
                        {activeTab === 'game' && (
                            <div className="h-full flex flex-col animate-pop-in pt-10">
                                <MemoryTaskGame tasks={tasks} />
                            </div>
                        )}

                        {/* --- 列表頁：詳細紀錄 --- */}
                        {activeTab === 'list' && (
                            <div className="h-full flex flex-col animate-pop-in pt-10 px-6 overflow-y-auto">
                                <h1 className="text-2xl font-black text-capy-text mb-6 drop-shadow-sm">事項總覽</h1>
                                {tasks.length === 0 ? (
                                    <div className="text-center opacity-70 mt-10 bg-white/60 p-6 rounded-3xl border border-white/50 backdrop-blur"><p className="font-bold text-sm">尚無任何紀錄</p></div>
                                ) : (
                                    <div className="space-y-3 pb-10">
                                        {tasks.map(task => {
                                            const cat = categories.find(c => c.id === task.category) || categories[2];
                                            return (
                                                <div key={task.id} className={`p-4 rounded-2xl border flex items-center justify-between transition-all backdrop-blur-md ${task.isTriggered ? 'bg-gray-50/80 border-gray-200 grayscale opacity-60' : 'bg-white/90 border-white/50 shadow-sm'}`}>
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-inner ${task.isTriggered ? 'bg-gray-200' : 'bg-capy-header'}`}>
                                                            {cat.icon}
                                                        </div>
                                                        <div>
                                                            <h3 className={`font-bold text-base ${task.isTriggered ? 'line-through text-gray-400' : 'text-capy-text'}`}>{task.title}</h3>
                                                            <div className="text-xs font-bold text-capy-light/80 mt-1">
                                                                {task.date.replace(/-/g, '/')} • {task.time}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => handleDeleteTask(task.id)} className="p-2 text-gray-300 hover:text-red-400 active:scale-90 transition-transform">
                                                        <Icons.Trash />
                                                    </button>
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* --- 底部導航列 --- */}
                    <nav className="absolute bottom-0 w-full bg-white/80 backdrop-blur-xl rounded-t-[2.5rem] shadow-[0_-5px_30px_rgba(0,0,0,0.06)] flex justify-around items-center px-4 z-20 border-t border-white/60 nav-safe pt-3 pb-3">
                        <button onClick={() => { setActiveTab('home'); playTone('pop'); }} className={`flex flex-col items-center gap-1 p-2 w-14 transition-colors ${activeTab === 'home' ? 'text-capy-primary' : 'text-gray-400'}`}>
                            <Icons.Home />
                            <span className="text-[10px] font-bold">提醒</span>
                        </button>

                        <button onClick={() => { setActiveTab('diary'); playTone('pop'); }} className={`flex flex-col items-center gap-1 p-2 w-14 transition-colors ${activeTab === 'diary' ? 'text-capy-primary' : 'text-gray-400'}`}>
                            <Icons.Pen />
                            <span className="text-[10px] font-bold">日記</span>
                        </button>

                        <div className="relative -top-8 mx-1">
                            <button 
                                onClick={() => { setIsSheetOpen(true); playTone('pop'); }}
                                className="bg-capy-primary text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-capy-primary/40 hover:brightness-105 active:scale-90 transition-transform border-[3px] border-white"
                            >
                                <Icons.Plus />
                            </button>
                        </div>

                        <button onClick={() => { setActiveTab('game'); playTone('pop'); }} className={`flex flex-col items-center gap-1 p-2 w-14 transition-colors ${activeTab === 'game' ? 'text-capy-primary' : 'text-gray-400'}`}>
                            <Icons.Gamepad />
                            <span className="text-[10px] font-bold">遊戲</span>
                        </button>

                        <button onClick={() => { setActiveTab('list'); playTone('pop'); }} className={`flex flex-col items-center gap-1 p-2 w-14 transition-colors ${activeTab === 'list' ? 'text-capy-primary' : 'text-gray-400'}`}>
                            <Icons.Book />
                            <span className="text-[10px] font-bold">紀錄</span>
                        </button>
                    </nav>

                    {/* --- 新增提醒 Bottom Sheet --- */}
                    {isSheetOpen && (
                        <div className="absolute inset-0 z-40 flex flex-col justify-end">
                            <div className="absolute inset-0 bg-capy-text/40 backdrop-blur-[2px] transition-opacity" onClick={() => setIsSheetOpen(false)}></div>
                            <div className="relative bg-white/95 backdrop-blur-xl w-full rounded-t-[2.5rem] pt-5 pb-10 px-6 animate-slide-up shadow-2xl max-h-[90vh] overflow-y-auto border-t border-white">
                                <div className="w-12 h-1.5 bg-gray-300/50 rounded-full mx-auto mb-5"></div>
                                <div className="flex justify-between items-center mb-5">
                                    <h2 className="text-xl font-black flex items-center gap-2 text-capy-text"><span>🔔</span> 新增提醒</h2>
                                    <button onClick={() => setIsSheetOpen(false)} className="p-2 bg-gray-100/50 rounded-full text-gray-500 hover:bg-gray-200"><Icons.Close /></button>
                                </div>
                                
                                <form onSubmit={handleAddTask} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-capy-light mb-2">分類標籤</label>
                                        <div className="flex gap-2">
                                            {categories.map(cat => (
                                                <button 
                                                    key={cat.id} type="button" 
                                                    onClick={() => { setCategory(cat.id); playTone('pop'); }}
                                                    className={`flex-1 py-2 rounded-xl text-[11px] font-bold border transition-all ${category === cat.id ? cat.color + ' shadow-sm scale-105' : 'bg-gray-50/50 border-gray-200 text-gray-500'}`}
                                                >
                                                    {cat.icon} {cat.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-capy-light mb-2">你要做什麼？</label>
                                        <input 
                                            type="text" value={title} onChange={e => setTitle(e.target.value)} 
                                            placeholder="自由輸入事項..." 
                                            className="w-full bg-capy-bg/50 rounded-xl px-4 py-3.5 outline-none font-bold text-capy-text border border-capy-secondary/50 focus:ring-2 focus:ring-capy-primary/40 transition-all text-sm" 
                                            required 
                                        />
                                    </div>

                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-capy-light mb-2">日期</label>
                                            <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-capy-bg/50 rounded-xl px-4 py-3 outline-none font-bold text-capy-text border border-capy-secondary/50 focus:ring-2 focus:ring-capy-primary/40 text-sm" required />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-capy-light mb-2">時間</label>
                                            <input type="time" value={time} onChange={e => setTime(e.target.value)} className="w-full bg-capy-bg/50 rounded-xl px-4 py-3 outline-none font-bold text-capy-text border border-capy-secondary/50 focus:ring-2 focus:ring-capy-primary/40 text-sm" required />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setQuickTime('10m')} className="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-capy-primary border border-capy-primary/30 shadow-sm active:scale-95 transition-all">10分鐘後</button>
                                        <button type="button" onClick={() => setQuickTime('1h')} className="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-capy-primary border border-capy-primary/30 shadow-sm active:scale-95 transition-all">1小時後</button>
                                        <button type="button" onClick={() => setQuickTime('tmr')} className="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-capy-primary border border-capy-primary/30 shadow-sm active:scale-95 transition-all">明天</button>
                                    </div>

                                    <button type="submit" className="w-full bg-capy-primary text-white font-black text-base py-4 rounded-xl mt-2 active:scale-95 transition-transform shadow-lg shadow-capy-primary/30 flex justify-center items-center gap-2">
                                        交給水豚記住
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- 全螢幕到期提醒 --- */}
                    {activeAlert && (
                        <div className="absolute inset-0 z-[7000] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-capy-text/50 backdrop-blur-sm" onClick={() => setActiveAlert(null)}></div>
                            <div className="relative w-full max-w-sm bg-white/95 backdrop-blur-xl rounded-3xl p-8 flex flex-col items-center text-center animate-pop-in shadow-2xl overflow-hidden border border-white/50">
                                <div className="absolute top-0 inset-x-0 h-32 bg-gradient-to-b from-capy-secondary/40 to-transparent pointer-events-none"></div>
                                
                                <div className="z-10 mb-4 bg-white p-2 rounded-full shadow-sm border-2 border-capy-bg animate-bounce-slow">
                                    <CuteCapyIcon className="w-24 h-24" />
                                </div>
                                
                                <div className="mt-2 z-10 w-full">
                                    <span className="inline-block bg-capy-accent text-white font-bold px-4 py-1.5 rounded-full text-xs mb-4 shadow-sm tracking-wider">
                                        時間到了喔！
                                    </span>
                                    <h2 className="text-xl font-black text-capy-text mb-3 break-words leading-tight">{activeAlert.title}</h2>
                                    <div className="flex justify-center items-center gap-4 text-capy-light font-bold text-sm mb-8 bg-capy-bg/50 border border-capy-secondary/30 py-2 px-4 rounded-xl">
                                        <span className="flex items-center gap-1"><Icons.Calendar /> {activeAlert.date.substring(5).replace('-', '/')}</span>
                                        <span className="flex items-center gap-1"><Icons.Bell /> {activeAlert.time}</span>
                                    </div>
                                    <button onClick={() => { setActiveAlert(null); playTone('pop'); }} className="w-full bg-capy-primary text-white font-black text-lg py-3.5 rounded-xl active:scale-95 transition-transform shadow-lg shadow-capy-primary/30">
                                        收到啦！
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

        const playBeep = (type = 'success') => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.setValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {}
        };

        let canvasCapybaraImg = null;
        if (typeof Blob !== 'undefined') {
            const blob = new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250"><g stroke="#000000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><path d="M 50 235 C 50 255, 75 255, 75 235" fill="#D48B6A" /><path d="M 150 235 C 150 255, 125 255, 125 235" fill="#D48B6A" /><path d="M 100 115 C 170 115, 195 180, 190 230 C 185 245, 15 245, 10 230 C 5 180, 30 115, 100 115 Z" fill="#D48B6A" /><path d="M 70 125 C 60 100, 85 110, 90 120" fill="#D48B6A" /><path d="M 130 125 C 140 100, 115 110, 110 120" fill="#D48B6A" /><circle cx="55" cy="165" r="9" fill="#000" stroke="none" /><circle cx="145" cy="165" r="9" fill="#000" stroke="none" /><path d="M 90 175 C 90 165, 110 165, 110 175 C 110 185, 90 185, 90 175 Z" fill="#000" stroke="none"/><path d="M 100 185 L 100 200" fill="none" /><path d="M 100 200 C 115 215, 130 200, 125 195" fill="none" /><path d="M 100 200 C 85 215, 70 200, 75 195" fill="none" /><path d="M 100 55 C 145 55, 160 95, 155 125 C 150 135, 50 135, 45 125 C 40 95, 55 55, 100 55 Z" fill="#D48B6A" /><path d="M 75 60 C 65 45, 90 50, 90 60" fill="#D48B6A" /><path d="M 125 60 C 135 45, 110 50, 110 60" fill="#D48B6A" /><circle cx="70" cy="85" r="6" fill="#000" stroke="none" /><circle cx="130" cy="85" r="6" fill="#000" stroke="none" /><path d="M 94 92 C 94 88, 106 88, 106 92 C 106 96, 94 96, 94 92 Z" fill="#000" stroke="none"/><path d="M 100 96 L 100 105" fill="none" />
                    <path d="M 100 105 C 110 115, 120 105, 115 102" fill="none" /><path d="M 100 105 C 90 115, 80 105, 85 102" fill="none" /><path d="M 100 10 C 130 10, 140 40, 135 60 C 130 70, 70 70, 65 60 C 60 40, 70 10, 100 10 Z" fill="#D48B6A" /><path d="M 80 15 C 75 0, 95 10, 95 15" fill="#D48B6A" /><path d="M 120 15 C 125 0, 105 10, 105 15" fill="#D48B6A" /><circle cx="80" cy="35" r="5" fill="#000" stroke="none" /><circle cx="120" cy="35" r="5" fill="#000" stroke="none" /><path d="M 96 40 C 96 37, 104 37, 104 40 C 104 43, 96 43, 96 40 Z" fill="#000" stroke="none"/><path d="M 100 43 L 100 50" fill="none" /><path d="M 100 50 C 108 58, 115 50, 112 48" fill="none" /><path d="M 100 50 C 92 58, 85 50, 88 48" fill="none" /></g></svg>`], {type: 'image/svg+xml;charset=utf-8'});

        }

        const MemoryTaskGame = ({ tasks }) => {
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [solved, setSolved] = useState([]);
            const [comboMsg, setComboMsg] = useState('');

            const emojis = ['💼', '🏠', '💡', '🏃', '🍎', '🦦'];
            
            useEffect(() => {
                const initialCards = [...emojis, ...emojis]
                    .sort(() => Math.random() - 0.5)
                    .map((icon, id) => ({ id, icon }));
                setCards(initialCards);
                setFlipped([]);
                setSolved([]);
            }, []);

            const handleFlip = (index) => {
                if (flipped.length === 2 || flipped.includes(index) || solved.includes(index)) return;
                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    const match = cards[newFlipped[0]].icon === cards[newFlipped[1]].icon;
                    if (match) {
                        setSolved([...solved, ...newFlipped]);
                        
                        // 互動式提醒：從未完成的任務中隨機挑選提示
                        const activeTasks = tasks.filter(t => !t.isTriggered);
                        if (activeTasks.length > 0) {
                            const randomTask = activeTasks[Math.floor(Math.random() * activeTasks.length)];
                            setComboMsg(`✨ 溫馨提醒: ${randomTask.title}`);
                        } else {
                            setComboMsg(`✨ 太棒了！目前沒有未完成的任務！`);
                        }
                        
                        // 播放音效
                        try { playBeep('success'); } catch(e){}
                        setTimeout(() => setComboMsg(''), 3000);
                    } else {
                        try { playBeep('error'); } catch(e){}
                    }
                    setTimeout(() => setFlipped([]), 800);
                }
            };

            return (
                <div className="flex-1 w-full h-full relative flex flex-col items-center py-8 px-6 bg-gradient-to-b from-[#FFF2E8] to-[#FDFAF5] rounded-t-[2.5rem] shadow-inner border-t border-orange-100 overflow-y-auto">
                    <div className="text-center mb-6">
                        <h2 className="text-3xl font-black text-capy-text">任務記憶大師</h2>
                        <p className="text-base font-bold text-capy-light mt-2">配對圖案，解鎖你的日常提醒！</p>
                    </div>
                    
                    {comboMsg && (
                        <div className="absolute top-28 bg-white/95 backdrop-blur-sm px-6 py-5 rounded-2xl shadow-xl border-2 border-orange-200 text-orange-600 font-bold z-10 animate-pop-in text-center w-[85%] text-lg">
                            {comboMsg}
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-5 w-full max-w-[320px]">
                        {cards.map((card, i) => {
                            const isFlipped = flipped.includes(i) || solved.includes(i);
                            return (
                                <div 
                                    key={card.id} 
                                    onClick={() => handleFlip(i)}
                                    className={`h-28 rounded-2xl cursor-pointer transition-all duration-300 shadow-sm flex items-center justify-center text-5xl ${isFlipped ? 'bg-white border-2 border-orange-200 scale-100' : 'bg-capy-primary border-b-4 border-[#B8815A] active:scale-95'}`}
                                >
                                    {isFlipped ? card.icon : '❓'}
                                </div>
                            );
                        })}
                    </div>
                    
                    {solved.length === cards.length && cards.length > 0 && (
                        <div className="mt-10 animate-bounce-slow">
                            <button onClick={() => {
                                setCards([...emojis, ...emojis].sort(() => Math.random() - 0.5).map((icon, id) => ({ id, icon })));
                                setFlipped([]); setSolved([]);
                            }} className="bg-orange-500 text-white font-black py-4 px-10 rounded-full shadow-lg active:scale-95 transition-transform text-lg">再來一局</button>
                        </div>
                    )}

            );
        };

        // --- 主應用程式 ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            
            // 任務資料 (提醒)
            const [tasks, setTasks] = useState(() => { try { return JSON.parse(localStorage.getItem('capy_tasks_v3')) || []; } catch(e) { return []; } });

            // 日記資料 (結合圖片)
            const [diary, setDiary] = useState(() => { try { return JSON.parse(localStorage.getItem('capy_diary_v1')) || []; } catch(e) { return []; } });

            const [isSheetOpen, setIsSheetOpen] = useState(false);
            const [sheetMode, setSheetMode] = useState('menu'); // 'menu', 'reminder', 'diary'
            const [activeAlert, setActiveAlert] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            
            // Task form state
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [time, setTime] = useState('');
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [selectedCategory, setSelectedCategory] = useState(null);

            // 提取歷史獨立標題用於 Autocomplete
            const pastTitles = [...new Set(tasks.map(t => t.title))];

            // 智能靈感庫大數據
            const inspirationData = {
                work: { icon: '💼', theme: 'blue', label: '工作事項', items: ['回覆重要郵件', '準備會議資料', '提交工作報告', '整理桌面與檔案', '規劃下週行程', '追蹤專案進度', '聯繫重要客戶', '發送電子報'] },
                family: { icon: '🏠', theme: 'orange', label: '家庭生活', items: ['採買生鮮雜貨', '繳納水電帳單', '洗衣服曬衣服', '居家環境大掃除', '準備家庭晚餐', '陪伴家人孩子', '預約定期維修', '倒垃圾回收'] },
                idea: { icon: '💡', theme: 'purple', label: '靈感學習', items: ['閱讀專業書籍', '紀錄突發靈感', '學習線上課程', '聽Podcast進修', '覆盤今日反思', '規劃長期目標', '整理筆記大綱', '構思新企劃'] },
                health: { icon: '🏃', theme: 'green', label: '身心健康', items: ['喝一大杯溫水', '運動拉筋30分鐘', '吃保健營養品', '預約定期看診', '閉眼冥想5分鐘', '提早準備睡覺', '起身走動伸展', '眼睛放鬆休息'] }
            };

            const themeClasses = {
                blue: { btn: 'bg-blue-50 border-blue-200 text-blue-600 hover:bg-blue-100', activeCard: 'bg-blue-50 border-blue-300 text-blue-700' },
                orange: { btn: 'bg-orange-50 border-orange-200 text-orange-600 hover:bg-orange-100', activeCard: 'bg-orange-50 border-orange-300 text-orange-700' },
                purple: { btn: 'bg-purple-50 border-purple-200 text-purple-600 hover:bg-purple-100', activeCard: 'bg-purple-50 border-purple-300 text-purple-700' },
                green: { btn: 'bg-green-50 border-green-200 text-green-600 hover:bg-green-100', activeCard: 'bg-green-50 border-green-300 text-green-700' }
            };

            // 快捷時間設定器
            const setQuickTime = (type) => {
                const now = new Date();
                if (type === '10m') now.setMinutes(now.getMinutes() + 10);
                else if (type === '1h') now.setHours(now.getHours() + 1);
                else if (type === 'tmr') { now.setDate(now.getDate() + 1); now.setHours(9, 0, 0, 0); }
                
                const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                setDate(localDate);
                setTime(now.toTimeString().substring(0, 5));
            };

            // Diary form state
            const [diaryText, setDiaryText] = useState('');
            const [diaryImg, setDiaryImg] = useState('');
            const [activeTags, setActiveTags] = useState([]);
            
            // Stats state
            const [stats, setStats] = useState({ work: 0, family: 0, idea: 0, health: 0 });

            // Toast helper
            const showT = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); };

            // Save Tasks safely
            useEffect(() => { try { localStorage.setItem('capy_tasks_v3', JSON.stringify(tasks)); } catch (e) {} }, [tasks]);

            // Save Diary safely with Quota Handling
            useEffect(() => {
                try {
                    localStorage.setItem('capy_diary_v1', JSON.stringify(diary));
                } catch (e) {
                    if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
                        // 記憶體防爆：刪除舊的 50% 紀錄
                        const safeDiary = diary.slice(0, Math.floor(diary.length / 2));
                        setDiary(safeDiary);
                        localStorage.setItem('capy_diary_v1', JSON.stringify(safeDiary));
                        showT('⚠️ 儲存空間已滿，已自動清理舊紀錄！');
                    }
                }
            }, [diary]);

            useEffect(() => { if ("Notification" in window && Notification.permission !== "granted") Notification.requestPermission(); }, []);

            useEffect(() => {
                if (isSheetOpen && sheetMode === 'reminder') {
                    const now = new Date();
                    const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    setDate(localDate); setTime(now.toTimeString().substring(0, 5));
                }
            }, [isSheetOpen, sheetMode]);

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const currentLocalTime = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
                    const currentDateStr = currentLocalTime.toISOString().split('T')[0];
                    const currentTimeStr = now.toTimeString().substring(0, 5);

                    const dueTask = tasks.find(t => t.date === currentDateStr && t.time === currentTimeStr && !t.isTriggered);

                    if (dueTask) {
                        setTasks(prev => prev.map(t => t.id === dueTask.id ? { ...t, isTriggered: true } : t));
                        setActiveAlert(dueTask); playBeep('success');
                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                        if (document.hidden && "Notification" in window && Notification.permission === "granted") {
                            new Notification("水豚與我 - 提醒您 🔔", { body: `時間到了：${dueTask.title}` });
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [tasks]);

            // --- Handlers ---
            const handleAddTask = (e) => {
                e.preventDefault(); if (!title.trim() || !date || !time) return;
                const newTask = { id: Date.now().toString(), title: title.trim(), date, time, isTriggered: false };
                setTasks(prev => [...prev, newTask].sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`)));
                setTitle(''); setIsSheetOpen(false); setActiveTab('home'); showT('✨ 提醒事項已成功新增！');
            };

            const handleDeleteTask = (id) => { setTasks(prev => prev.filter(t => t.id !== id)); };

            const handleImageUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 500; let ratio = MAX_WIDTH / img.width; if (ratio > 1) ratio = 1;
                        canvas.width = img.width * ratio; canvas.height = img.height * ratio;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        setDiaryImg(canvas.toDataURL('image/jpeg', 0.7)); showT('📸 相片壓縮處理成功！');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const toggleTag = (tag) => {
                if(activeTags.includes(tag)) setActiveTags(activeTags.filter(t => t !== tag));
                else setActiveTags([...activeTags, tag]);
            };

            const handleAddDiary = () => {
                if (!diaryText.trim() && !diaryImg) return showT('請輸入文字或上傳照片！');
                
                // AI Local Reminder Extraction
                let aiSuggestion = null;
                const checkStr = diaryText.toLowerCase();
                if(checkStr.match(/明天|下週|下午/)) {
                    if(checkStr.includes('開會') || checkStr.includes('報告')) aiSuggestion = '準備會議資料';
                    else if(checkStr.includes('買')) aiSuggestion = '記得採買物品';
                    else if(checkStr.includes('醫生') || checkStr.includes('看診')) aiSuggestion = '回診時間';
                    else aiSuggestion = '回顧日記重點';
                }

                const newEntry = { id: Date.now().toString(), time: new Date().getTime(), text: diaryText, tags: activeTags, img: diaryImg };
                setDiary(prev => [newEntry, ...prev]);
                
                if (aiSuggestion) {
                    const tmr = new Date(new Date().getTime() + 86400000);
                    const localDate = new Date(tmr.getTime() - (tmr.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                    setTasks(prev => [...prev, { id: Date.now().toString()+'_ai', title: '🤖 AI建議: '+aiSuggestion, date: localDate, time: '09:00', isTriggered: false }].sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`)));
                    showT(`📝 紀錄成功！AI 已為您加入明日提醒：${aiSuggestion}`);
                } else {
                    showT('📝 日記大數據儲存成功！');
                }

                setDiaryText(''); setDiaryImg(''); setActiveTags([]); setIsSheetOpen(false); setActiveTab('diary');
            };

            const deleteDiary = (id) => { setDiary(prev => prev.filter(d => d.id !== id)); };

            const handleExport = () => {
                const backupData = { tasks, diary };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `capybara_pro_backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); showT("✅ 備份檔已成功下載！");

            const handleImport = (e) => {
                const file = e.target.files[0]; if (!file) return;

                        if (data.tasks !== undefined) setTasks(data.tasks);

                reader.readAsText(file); e.target.value = null;
            };

                    if (txt.includes('工作') || txt.includes('開會') || txt.includes('報告') || txt.includes('專案')) w += 15;
                    if (txt.includes('家庭') || txt.includes('家事') || txt.includes('陪伴') || txt.includes('採買')) f += 15;
                    if (txt.includes('靈感') || txt.includes('設計') || txt.includes('寫作') || txt.includes('筆記')) i += 15;
                    if (txt.includes('健康') || txt.includes('運動') || txt.includes('睡眠') || txt.includes('水')) h += 15;

                                            <div className="bg-white/60 p-2 rounded-[2rem] shadow-sm animate-wiggle"><StackedCapybarasIcon className="w-32 h-40" /></div>

                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>

                                                <button onClick={() => deleteDiary(d.id)} className="text-gray-300 hover:text-red-400"><Icons.Trash /></button>

                                            {d.tags && d.tags.length > 0 && <div className="flex flex-wrap gap-2 mb-3">{d.tags.map(t=><span key={t} className="bg-blue-50 text-blue-500 text-xs px-2 py-1 rounded-md font-bold">#{t}</span>)}</div>}

                                                    <img src={d.img} className="w-full rounded-2xl border border-gray-100 mb-2" />
                                                    <a href={d.img} download={`memory_${d.time}.jpg`} className="inline-block bg-capy-bg text-capy-primary text-xs font-bold py-2 px-4 rounded-xl border border-capy-secondary">📥 下載相片至裝置</a>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* --- Tab: Stats --- */}
                        {activeTab === 'stats' && (

                                <h1 className="text-2xl font-black text-capy-text mb-1">能力圖鑑</h1>

                                        <div className="radar-item"><div className="radar-header"><span>👨‍👩‍👧‍👦 家庭生活</span><span>Lv.{Math.floor(stats.family/10)}</span></div><div className="stat-bar-bg"><div className="stat-bar-fill bg-white" style={{width: `${stats.family}%`}}></div></div></div>
                                        <div className="radar-item"><div className="radar-header"><span>💡 創意靈感</span><span>Lv.{Math.floor(stats.idea/10)}</span></div><div className="stat-bar-bg"><div className="stat-bar-fill bg-white" style={{width: `${stats.idea}%`}}></div></div></div>

                                    <button onClick={scanStats} className="mt-6 w-full bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-colors text-sm border border-white/40">🔍 啟動 AI 深度掃描</button>
                                </div>
                                <h3 className="font-bold text-capy-text mb-4">🎖️ 專屬徽章</h3>
                                <div className="badge-grid">
                                    <div className={`badge-item ${stats.work > 0 ? 'unlocked' : ''}`}><div className="badge-icon">💼{stats.work > 0 && <div className="badge-count">{Math.floor(stats.work/15)}</div>}</div><div className="text-[10px] font-bold">工作達人</div></div>
                                    <div className={`badge-item ${stats.family > 0 ? 'unlocked' : ''}`}><div className="badge-icon">🏠{stats.family > 0 && <div className="badge-count">{Math.floor(stats.family/15)}</div>}</div><div className="text-[10px] font-bold">家庭守護</div></div>
                                    <div className={`badge-item ${stats.idea > 0 ? 'unlocked' : ''}`}><div className="badge-icon">💡{stats.idea > 0 && <div className="badge-count">{Math.floor(stats.idea/15)}</div>}</div><div className="text-[10px] font-bold">靈感大師</div></div>
                                    <div className={`badge-item ${stats.health > 0 ? 'unlocked' : ''}`}><div className="badge-icon">🏃{stats.health > 0 && <div className="badge-count">{Math.floor(stats.health/15)}</div>}</div><div className="text-[10px] font-bold">健康寶寶</div></div>

                        <button onClick={() => setActiveTab('diary')} className={`flex flex-col items-center gap-1 p-2 transition-all ${activeTab === 'diary' ? 'text-capy-primary transform -translate-y-1' : 'text-gray-300'}`}><Icons.Book active={activeTab === 'diary'} /><span className="text-[11px] font-bold">日記</span></button>

                                                value={title} 
                                                onChange={e => setTitle(e.target.value)} 
                                                onFocus={() => setShowSuggestions(true)} 
                                                onBlur={() => setTimeout(() => setShowSuggestions(false), 200)} 
                                                placeholder="自由輸入事項..." 
                                                className="w-full bg-white rounded-2xl px-5 py-4 outline-none font-medium text-capy-text border-2 border-transparent focus:border-capy-secondary focus:ring-4 focus:ring-capy-primary/10 shadow-sm transition-all" 
                                                required 
                                            />
                                            {/* 歷史紀錄 Autocomplete */}
                                            {showSuggestions && pastTitles.filter(t => t.toLowerCase().includes(title.toLowerCase()) && t !== title).length > 0 && (
                                                <div className="absolute z-50 w-full bg-white mt-2 rounded-2xl shadow-xl border border-gray-100 max-h-48 overflow-y-auto">
                                                    <div className="text-[10px] text-gray-400 font-bold px-4 pt-3 pb-1 bg-gray-50/80 sticky top-0 backdrop-blur-md">曾輸入過的紀錄</div>
                                                    {pastTitles.filter(t => t.toLowerCase().includes(title.toLowerCase()) && t !== title).map((t, i) => (
                                                        <div key={i} className="px-5 py-3 hover:bg-orange-50 cursor-pointer text-sm font-bold text-capy-text border-b border-gray-50 last:border-0 transition-colors" onMouseDown={() => { setTitle(t); setShowSuggestions(false); }}>
                                                            <span className="text-gray-400 mr-2">🕒</span> {t}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex gap-4 pt-2">
                                            <div className="flex-1"><label className="block text-sm font-bold text-capy-light mb-2 ml-1">日期</label><input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-white rounded-2xl px-4 py-4 outline-none font-medium text-capy-text border border-gray-100 shadow-sm" required /></div>
                                            <div className="flex-1"><label className="block text-sm font-bold text-capy-light mb-2 ml-1">時間</label><input type="time" value={time} onChange={e => setTime(e.target.value)} className="w-full bg-white rounded-2xl px-4 py-4 outline-none font-medium text-capy-text border border-gray-100 shadow-sm" required /></div>
                                        </div>

                                        {/* 快捷時間按鈕 */}
                                        <div className="flex gap-2 justify-center mt-2">
                                            <button type="button" onClick={() => setQuickTime('10m')} className="flex-1 py-3 rounded-xl text-xs font-bold bg-white text-gray-500 border border-gray-200 hover:bg-orange-50 hover:text-orange-600 hover:border-orange-200 active:scale-95 transition-all shadow-sm">10分鐘後</button>
                                            <button type="button" onClick={() => setQuickTime('1h')} className="flex-1 py-3 rounded-xl text-xs font-bold bg-white text-gray-500 border border-gray-200 hover:bg-orange-50 hover:text-orange-600 hover:border-orange-200 active:scale-95 transition-all shadow-sm">1小時後</button>
                                            <button type="button" onClick={() => setQuickTime('tmr')} className="flex-1 py-3 rounded-xl text-xs font-bold bg-white text-gray-500 border border-gray-200 hover:bg-orange-50 hover:text-orange-600 hover:border-orange-200 active:scale-95 transition-all shadow-sm">明天早上</button>
                                        </div>

                                        <button type="submit" className="w-full bg-capy-primary text-white font-black text-lg py-4 rounded-2xl mt-4 active:scale-95 transition-transform shadow-lg shadow-capy-primary/30 flex items-center justify-center gap-2">
                                            <Icons.Bell /> 讓水豚幫你記住
                                        </button>
                                    </form>
                                )}

                                {sheetMode === 'diary' && (
                                    <div className="px-2 space-y-5">
                                        <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                            <div className="text-xs font-bold text-gray-400 mb-2">快速標籤</div>
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={() => toggleTag('工作')} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${activeTags.includes('工作')?'bg-blue-100 text-blue-600 border-blue-200':'bg-white text-gray-500 border-gray-200'}`}>💼 工作</button>
                                                <button onClick={() => toggleTag('家庭')} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${activeTags.includes('家庭')?'bg-orange-100 text-orange-600 border-orange-200':'bg-white text-gray-500 border-gray-200'}`}>👨‍👩‍👧‍👦 家庭</button>
                                                <button onClick={() => toggleTag('靈感')} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${activeTags.includes('靈感')?'bg-purple-100 text-purple-600 border-purple-200':'bg-white text-gray-500 border-gray-200'}`}>💡 靈感</button>
                                                <button onClick={() => toggleTag('健康')} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${activeTags.includes('健康')?'bg-green-100 text-green-600 border-green-200':'bg-white text-gray-500 border-gray-200'}`}>🏃 健康</button>
                                            </div>
                                        </div>
                                        
                                        {!diaryImg ? (
                                            <label className="flex flex-col items-center justify-center bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl p-6 cursor-pointer text-blue-500 active:scale-95 transition-transform">
                                                <span className="text-3xl mb-2">📸</span><span className="font-bold text-sm">拍攝或上傳相片 (將自動極致壓縮)</span>
                                                <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                            </label>
                                        ) : (
                                            <div className="relative">
                                                <img src={diaryImg} className="w-full rounded-2xl border-4 border-white shadow-md object-cover max-h-48" />
                                                <button onClick={() => setDiaryImg('')} className="absolute top-2 right-2 bg-white p-1.5 rounded-full shadow hover:text-red-500"><Icons.Close /></button>
                                            </div>
                                        )}
                                        
                                        <textarea className="w-full bg-capy-bg rounded-2xl p-4 border-none outline-none focus:ring-2 focus:ring-capy-secondary resize-none font-medium text-capy-text" rows="3" placeholder="記錄今天的點滴，AI 將為您分析並產生智慧提醒..." value={diaryText} onChange={e => setDiaryText(e.target.value)}></textarea>
                                        <button onClick={handleAddDiary} className="w-full bg-gradient-to-r from-blue-400 to-blue-500 text-white font-black text-lg py-4 rounded-2xl shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
                                            ⚡ 啟動 AI 儲存與分析
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* --- 全螢幕到期提醒 --- */}
                    {activeAlert && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-capy-bg/80 backdrop-blur-md"></div>
                            <div className="relative w-full max-w-sm bg-white rounded-[3rem] p-8 flex flex-col items-center text-center animate-pop-in shadow-2xl overflow-hidden border border-gray-100">
                                <div className="absolute top-0 inset-x-0 h-36 bg-capy-header rounded-b-[100%] pointer-events-none"></div>
                                <div className="z-10 mb-2 bg-white p-3 rounded-[2rem] shadow-md border-2 border-white"><StackedCapybarasIcon className="w-28 h-36" animated={true} /></div>
                                <div className="mt-2 z-10 w-full">
                                    <span className="inline-block bg-capy-primary/10 text-capy-primary font-bold px-4 py-1 rounded-full text-sm mb-4">🔔 時間到了</span>
                                    <h2 className="text-2xl font-black text-capy-text mb-2 break-words">{activeAlert.title}</h2>
                                    <p className="text-capy-light font-medium flex items-center justify-center gap-2 mb-8"><Icons.Bell /> {activeAlert.time}</p>
                                    <button onClick={() => setActiveAlert(null)} className="w-full bg-capy-primary text-white font-bold text-xl py-4 rounded-full active:scale-95 transition-transform shadow-lg shadow-capy-primary/30">好的！</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
